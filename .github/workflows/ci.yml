name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The harness supports 22.19+ and 24+.
        node-version: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `prepare` runs tsc, so this both installs and builds. The tests import
      # the compiled output and never touch the network.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
